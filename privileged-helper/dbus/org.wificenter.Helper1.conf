<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  System-bus policy for the WIFI Center privileged helper. Anyone may *call* it (it is Polkit, not this file, that
  decides who may *do* anything); only root may own the name, so nobody can impersonate the helper.
-->
<busconfig>
  <policy user="root">
    <allow own="org.wificenter.Helper1"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.wificenter.Helper1" send_interface="org.wificenter.Helper1"/>
    <allow send_destination="org.wificenter.Helper1" send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="org.wificenter.Helper1" send_interface="org.freedesktop.DBus.Peer"/>
  </policy>
</busconfig>
