[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wifi-center"
version = "0.1.0"
description = "Security workstation and system management platform for Parrot OS"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "PySide6>=6.5",
    "psutil>=5.9",
    "pyqtgraph>=0.13",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
reports = ["matplotlib>=3.7"]

[project.scripts]
wifi-center = "wifi_center.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wifi_center = ["database/migrations/*.sql", "resources/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
